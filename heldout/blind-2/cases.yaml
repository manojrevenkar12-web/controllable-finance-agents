- id: close-01
  kind: close
  month: "2026-12"
  materiality_cents: 50000
  documents:
    - id: inv-1
      supplier_id: s-1
      supplier_name: Softwarehaus Lindenau GmbH
      date: "2026-12-01"
      net_total: 240000
      notes: "Wartungsvertrag WV-2209, Leistungszeitraum vom 01.12.2026 bis 30.11.2027"
      lines: [{net: 240000}]
      coding: [{account: "6837", cost_centre: "4000"}]
  history: []
  duplicates: []
  expect:
    entries:
      - {type: deferral, document_id: inv-1, debit: "1900", credit: "6837", amount_cents: 219616, cost_centre: "4000"}
  why: >-
    German 'vom ... bis ...' period 01.12.2026-30.11.2027 = 31 (Dec) + 334 (Jan-Nov 2027) = 365 days. Days after
    31.12.2026: 01.01.2027-30.11.2027 = 334. 240000 x 334 / 365 = 219616.438 -> 219616. Net 240000 >= 50000.

