            "2026-07", "2026-08", "2026-09", "2026-10"]
  splits:            # evaluation months: documents arriving in these months are what agents are scored on
    dev: "2026-11"
    test: "2026-12"
    heldout: "2027-01"

accounts:            # shared names; each company maps categories to its own choice of these
  "6815": Bürobedarf
