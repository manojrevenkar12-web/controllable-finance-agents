tax_keys:            # internal keys; the DATEV BU key used on export is configured per company in the ledger
  VSt19: { rate: 0.19, reverse_charge: false }
  VSt7: { rate: 0.07, reverse_charge: false }
  RC19: { rate: 0.19, reverse_charge: true }     # § 13b UStG: the recipient owes the VAT
  NONE: { rate: 0.0, reverse_charge: false }     # exempt, e.g. insurance premiums

categories:
