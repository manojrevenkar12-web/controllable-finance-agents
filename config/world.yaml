# The simulated world: companies, their charts of accounts and habits, suppliers, and what goes wrong.
# Generator and evaluation only. Agents, the ledger service and the console never read this file
# (tests/test_isolation.py). Account numbers are modelled on SKR04 ranges; names and mappings are illustrative.

