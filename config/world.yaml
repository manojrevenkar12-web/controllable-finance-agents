  breakfast:     { vat: 0.19, monthly: false, words: [Frühstück], new_words: [Frühstücksbuffet] }
  meals:         { vat: 0.19, monthly: false, words: [Geschäftsessen, Bewirtung, Abendessen mit Kunden], new_words: [Mittagessen Team-Offsite] }
