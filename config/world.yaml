# How real ledgers are messier than rules.
noise:
  history_miscoded: 0.03       # past lines booked to a wrong account (people make mistakes too)
  sku_share: 0.35              # lines from mixed-catalogue suppliers that name only an article number
  skus_per_category: 12
  cost_centre_note: 0.08       # documents whose notes assign them to another department's cost centre
habit_changes:                 # a company changes how it books a category from a month on
  t-nordlicht: { category: software, from: "2026-06", account: "6495" }
  t-elbwerk: { category: telecom, from: "2026-08", account: "6837" }
  t-rheinform: { category: training, from: "2026-07", account: "6825" }
  t-havelstrom: { category: office, from: "2026-05", account: "6845" }
  t-neckarbits: { category: marketing, from: "2026-09", account: "6825" }
  t-alsterkai: { category: hardware, from: "2026-06", account: "6815" }

# Recurring suppliers bill monthly; one recurring invoice per company may be missing at month end (an accrual).
recurring_categories: [cloud, telecom, rent]

# What goes wrong, per evaluation-month invoice (probabilities) and the decoys that look wrong but are not.
issues:
  duplicate: 0.05            # the same invoice again, number re-formatted
  iban_changed: 0.04         # bank details differ from the supplier master, no verified change on file
  vat_rate_wrong: 0.05       # a reduced rate on a standard-rated line
  reverse_charge_missing: 0.3   # share of EU-supplier invoices that charge German VAT instead of reverse charge
  arithmetic: 0.04           # net + VAT != gross
decoys:
  iban_changed_verified: 0.03     # bank details changed with a verified change on file: correct
  same_amount_new_number: 0.04    # a recurring invoice with the same amount and a new number: not a duplicate
deferrals:
  annual_share: 0.5          # share of software and insurance invoices that are annual, prepaid
  mid_month_start: 0.35      # share of annual periods that start mid-month (day-based pro rata)
cancellations: 0.25          # share of companies where one recurring contract ends with a note (no accrual)
