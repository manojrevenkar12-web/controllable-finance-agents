[project]
name = "controllable-finance-agents"
version = "0.1.0"
description = "Finance agents for spend management that prepare work, flag what they are unsure of, and stay under control"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0",
  "pydantic>=2.9",
  "numpy>=2.0",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pyjwt>=2.9",
  "langgraph>=0.6",
  "mcp>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.11", "types-PyYAML", "python-hcl2"]

[project.scripts]
cfa = "cfa.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cfa*"]

[tool.setuptools.package-data]
"cfa.ledger" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
